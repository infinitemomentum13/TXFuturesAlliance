# =============================================================================
# TX Futures Alliance — OpenAPI ADDITIONS (front end)
# =============================================================================
# New endpoints the three attached specs do NOT cover, written in the same
# REST style under /api/v1. These must be reviewed and absorbed into the real
# back end's OpenAPI specs before implementation. Same conventions:
# Bearer auth, { data, meta } pagination, Error schema from
# api_student_service.yaml.
#
# Status legend per path: [mock implemented] = the stand-in server answers
# today; [planned] = defined here, implemented in a later build step.
# =============================================================================
openapi: 3.0.3
info:
  title: TX Futures Alliance - API Additions (front end)
  version: 0.1.0
  description: >
    Endpoints added by the front end for certificate careers, consent
    records, Racing 360 reports, contact requests, colleges, and
    opportunities. Not part of the original blueprint — review before
    building the real back end.
servers:
  - url: /api/v1

paths:
  # ------------------------- CONSENT CENTER ------------------------------
  # Suggested table: consent_records(consent_id, student_id, consent_key,
  # granted, granted_at, granted_by_role, revoked_at)
  /students/{student_id}/consents:                       # [mock implemented]
    get:
      summary: Get per-purpose consent switches and access log
      responses:
        '200':
          description: Consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'
        '403': { description: Forbidden }
        '404': { description: Student not found }
    put:
      summary: Set consent switches (all start OFF)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                consents:
                  type: object
                  properties:
                    grades_for_matching: { type: boolean }
                    sports_to_colleges: { type: boolean }
                    sports_to_pro_clubs: { type: boolean }
                    videos: { type: boolean }
                    partner_contact: { type: boolean }
      responses:
        '200':
          description: Updated consent record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentRecord'

  # ------------------------- RACING 360 REPORTS --------------------------
  # Field names to confirm with the Racing 360 vendor.
  # Suggested table: racing360_reports(report_id, student_id, report_date,
  # metrics JSONB, source, file_url, coach_notes)
  /students/{student_id}/racing360-reports:              # [mock implemented]
    get:
      summary: List imported Racing 360 performance reports
      responses:
        '200':
          description: Reports, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Racing360Report'
    post:
      summary: Add a report (file import metadata or manual metric entry)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [report_date]
              properties:
                report_date: { type: string, format: date }
                metrics: { type: object }
                coach_notes: { type: string }
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Racing360Report'

  # ------------------------- CERTIFICATE CAREERS -------------------------
  # Suggested table: careers(career_id, title_en, title_es, credential,
  # credential_issuer, training_length_weeks, training_cost_usd,
  # funded_options TEXT[], min_age_train, min_age_work,
  # weeks_to_first_paycheck, starting_pay_rgv_hourly, starting_pay_tx_hourly,
  # career_ladder TEXT[], sector, training_providers JSONB, is_sample)
  /careers:                                              # [mock implemented]
    get:
      summary: List certificate/license careers with filters
      parameters:
        - { name: interest, in: query, schema: { type: string }, description: Compass interest key }
        - { name: funded, in: query, schema: { type: boolean } }
        - { name: max_weeks, in: query, schema: { type: integer } }
        - { name: start_under_18, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Paginated careers
  /careers/{career_id}:                                  # [mock implemented]
    get:
      summary: Career detail (training, pay, ladder, providers)
      responses:
        '200': { description: Career }
        '404': { description: Not found }
  /students/{student_id}/saved-careers:                  # [mock implemented]
    get: { summary: List saved careers, responses: { '200': { description: OK }, '403': { description: Forbidden } } }
    post:
      summary: Save a career
      responses:
        '201': { description: Created }
        '400': { description: career_id invalid }
        '409': { description: Already saved }
  /students/{student_id}/saved-careers/{saved_id}:       # [mock implemented]
    delete: { summary: Unsave a career, responses: { '204': { description: Removed }, '404': { description: Not found } } }

  # ------------------------- COLLEGES (global) ---------------------------
  # Suggested table: colleges(college_id, name, type, city, state_or_region,
  # country, in_rgv, spanish_support, soccer_program, is_sample)
  /colleges:                                             # [mock implemented]
    get:
      summary: Search US + international colleges/universities
      parameters:
        - { name: country, in: query, schema: { type: string, enum: [US, MX, ES, OTHER] } }
        - { name: in_rgv, in: query, schema: { type: boolean } }
        - { name: type, in: query, schema: { type: string, enum: [community_college, university, technical_college] } }
        - { name: soccer, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Paginated colleges }
  /colleges/{college_id}:                                # [mock implemented]
    get: { summary: College detail, responses: { '200': { description: College }, '404': { description: Not found } } }
  /students/{student_id}/saved-colleges:                 # [mock implemented]
    get: { summary: List saved colleges, responses: { '200': { description: OK } } }
    post:
      summary: Save a college
      responses:
        '201': { description: Created }
        '400': { description: college_id invalid }
        '409': { description: Already saved }
  /students/{student_id}/saved-colleges/{saved_id}:      # [mock implemented]
    delete: { summary: Unsave a college, responses: { '204': { description: Removed } } }

  # ------------------------- PATHWAY COMPASS -----------------------------
  # Suggested column on students: pathway_compass JSONB (already carried by
  # the sample data; the intake adds interests/sport/grades keys).
  /students/{student_id}/compass:                        # [mock implemented]
    get: { summary: Get Compass answers, responses: { '200': { description: PathwayCompass } } }
    put:
      summary: Save Compass answers (partial; sets completed_at)
      responses:
        '200': { description: Updated PathwayCompass }

  # ------------------------- MY PLAN / DASHBOARD -------------------------
  # Suggested tables: plan_actions(action_id, student_id, pathway, title_en,
  # title_es, due_date, status, origin, created_at, completed_at);
  # messages(message_id, student_id, from_name, from_role, body_en, body_es,
  # sent_at, read_at); deadlines as a view unioning scholarship deadlines,
  # partner events and career class starts.
  /students/{student_id}/plan-actions:                   # [mock implemented]
    get: { summary: List plan actions (starter set generated from Compass), responses: { '200': { description: OK } } }
    post: { summary: Add a plan action, responses: { '201': { description: Created }, '400': { description: Invalid input } } }
  /students/{student_id}/plan-actions/{action_id}:       # [mock implemented]
    patch: { summary: Update status/due date, responses: { '200': { description: Updated }, '404': { description: Not found } } }
  /students/{student_id}/deadlines:                      # [mock implemented]
    get: { summary: Upcoming deadlines (scholarships, tryouts, class starts), responses: { '200': { description: OK } } }
  /students/{student_id}/messages:                       # [mock implemented]
    get: { summary: Coach/counselor messages, newest first, responses: { '200': { description: OK } } }
  /students/{student_id}/messages/{message_id}:          # [mock implemented]
    patch: { summary: Mark read, responses: { '200': { description: Updated } } }
  /students/{student_id}/my-story:                       # [mock implemented]
    get: { summary: Get the student's "My Story" text, responses: { '200': { description: OK } } }
    put: { summary: Save "My Story" (max 1000 chars), responses: { '200': { description: Updated } } }

  # ------------------------- PROFILE EXTRAS ------------------------------
  # documents: suggested table student_documents(document_id, student_id,
  # kind, file_name, note, uploaded_at) — file bytes come with real storage.
  # test-scores: mirrors standardized_test_scores SQL table (no spec yet).
  # interests: mirrors career_interests SQL table (no spec yet).
  /students/{student_id}/documents:                      # [mock implemented]
    get: { summary: List documents, responses: { '200': { description: OK } } }
    post: { summary: Register a document (metadata only), responses: { '201': { description: Created }, '400': { description: Invalid input } } }
  /students/{student_id}/documents/{document_id}:        # [mock implemented]
    delete: { summary: Remove a document, responses: { '204': { description: Removed } } }
  /students/{student_id}/test-scores:                    # [mock implemented]
    get: { summary: List standardized test scores, responses: { '200': { description: OK } } }
    post: { summary: Add a test score, responses: { '201': { description: Created }, '400': { description: Invalid input } } }
  /students/{student_id}/interests:                      # [mock implemented]
    get: { summary: List career interests (SQL career_interests shape), responses: { '200': { description: OK } } }
    put: { summary: Replace career interests, responses: { '200': { description: Updated } } }

  # ------------------------- SCHOOLS -------------------------------------
  # Distinct sample school names, for the Compass picker. Real list comes
  # from district agreements.
  /schools:                                              # [mock implemented]
    get: { summary: List sample schools, responses: { '200': { description: OK } } }

  # ------------------------- MODE PROMOTION ------------------------------
  /students/{student_id}/promote-to-pathways:            # [mock implemented]
    post:
      summary: Move an explorer (under 13) to pathways mode — parent or admin only; in production triggered on the 13th birthday
      responses:
        '200': { description: Student updated (app_mode = pathways) }
        '403': { description: Parent of this child or admin only }
        '409': { description: Already in pathways mode }

  # ------------------------- OPPORTUNITIES (sports) ----------------------
  # Suggested table: opportunities(opportunity_id, lane, title, org, level,
  # age_range, location, dates, cost, requirements)
  /opportunities:                                        # [planned]
    get:
      summary: Sports opportunities (college / national / international lanes)
      parameters:
        - { name: lane, in: query, schema: { type: string, enum: [college, national, international] } }
      responses:
        '200': { description: Paginated opportunities }

  # ------------------------- CONTACT REQUESTS ----------------------------
  # Suggested table: contact_requests(request_id, student_id, requester_org,
  # requester_role, message, status, created_at, decided_at, decided_by)
  /contact-requests:                                     # [planned]
    post:
      summary: Partner/scout requests contact (parent approves if under 18)
      responses:
        '201': { description: Request created }
        '403': { description: Student has not consented }
  /students/{student_id}/contact-requests:               # [planned]
    get: { summary: List requests for a student (student/parent/staff), responses: { '200': { description: OK } } }
  /contact-requests/{request_id}/decision:               # [planned]
    post:
      summary: Approve or decline a contact request
      responses:
        '200': { description: Updated request }

  # ------------------------- INTERNSHIPS (schema exists, spec missing) ---
  # corporate_internships_schema.sql exists but had no OpenAPI spec; these
  # mirror those tables. Fill in fully when building the Career pathway.
  /partners:                                             # [planned]
    get: { summary: List corporate partners, responses: { '200': { description: OK } } }
  /internship-postings:                                  # [planned]
    get: { summary: List postings, responses: { '200': { description: OK } } }
    post: { summary: Create posting (partner role), responses: { '201': { description: Created } } }
  /students/{student_id}/internship-applications:        # [planned]
    get: { summary: List applications, responses: { '200': { description: OK } } }
    post: { summary: Apply to a posting, responses: { '201': { description: Created } } }

  # ------------------------- ADMIN ---------------------------------------
  /admin/reset-demo-data:                                # [mock implemented]
    post:
      summary: Reset the mock database to the sample seed (demo only)
      responses:
        '200': { description: Reset done }
        '403': { description: Admin only }

  # ------------------------- INTERNSHIPS & JOBS (Prompt 3) ---------------
  # Mirrors corporate_internships_schema.sql: internship_postings +
  # internship_applications. Responses are the STUDENT-FACING SUBSET —
  # partner contacts, financials, screening internals and statistics stay
  # server-side.
  /internships:                                         # [mock implemented]
    get:
      summary: List published, visible internship postings (joins company name)
      parameters:
        - { name: career_id, in: query, schema: { type: string } }
        - { name: paid, in: query, schema: { type: boolean } }
        - { name: sport_friendly, in: query, schema: { type: boolean } }
        - { name: category, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated list of InternshipPosting }
  /internships/{posting_id}:                            # [mock implemented]
    get:
      summary: Get one posting
      responses:
        '200': { description: InternshipPosting }
        '404': { description: Posting not found }
  /students/{student_id}/internship-applications:       # [mock implemented]
    get:
      summary: Student's applications with posting embedded, newest first
      responses:
        '200': { description: '{ data: InternshipApplication[] }' }
        '403': { description: Forbidden }
    post:
      summary: Apply to a posting (student role only; explorer mode blocked)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [posting_id]
              properties:
                posting_id: { type: string }
                application_responses:
                  type: object
                  additionalProperties: { type: string }
      responses:
        '201': { description: Created InternshipApplication (status submitted) }
        '403': { description: 'Forbidden / EXPLORER_MODE' }
        '404': { description: Posting not found }
        '409': { description: ALREADY_APPLIED | POSTING_FILLED | DEADLINE_PASSED }
  /students/{student_id}/internship-applications/{application_id}:  # [mock implemented]
    patch:
      summary: Withdraw an application
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [withdraw] }
      responses:
        '200': { description: Updated InternshipApplication (status withdrawn) }
        '409': { description: ALREADY_CLOSED }

  # ------------------------- CAREER PLANS (Prompt 3) ---------------------
  # Suggested table: career_plans(plan_id, student_id, career_id, created_at)
  # + career_plan_steps(plan_id, step_key, target_date, est_cost_usd,
  # documents JSONB). Creating a plan also appends its 5 steps to
  # plan_actions so they appear on the dashboard timeline.
  /careers/{career_id}/employers:                       # [mock implemented]
    get:
      summary: Partner companies hiring for this career
      responses:
        '200': { description: '{ data: CorporatePartner[] }' }
  /careers/{career_id}/plan:                            # [mock implemented]
    get:
      summary: Preview the 5-step plan (enroll→train→test→certified→apply), dated from today
      responses:
        '200': { description: '{ career_id, steps: CareerPlanStep[] }' }
  /students/{student_id}/career-plans:                  # [mock implemented]
    get:
      summary: Student's saved career plans (career embedded)
      responses:
        '200': { description: '{ data: CareerPlan[] }' }
    post:
      summary: Save a career plan and add its steps to the dashboard timeline
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [career_id]
              properties:
                career_id: { type: string }
      responses:
        '201': { description: Created CareerPlan }
        '403': { description: 'Forbidden / EXPLORER_MODE' }
        '409': { description: ALREADY_PLANNED }

  # ------------------------- COUNSELOR REQUESTS (Prompt 3) ---------------
  # Suggested table: counselor_requests(request_id, student_id, topic,
  # career_id NULL, posting_id NULL, body, status, created_at)
  /students/{student_id}/counselor-requests:            # [mock implemented]
    get:
      summary: Student's counselor requests, newest first
      responses:
        '200': { description: '{ data: CounselorRequest[] }' }
    post:
      summary: '"Talk to my counselor" — creates a request; mock auto-replies with a counselor message'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                topic: { type: string }
                career_id: { type: string, nullable: true }
                posting_id: { type: string, nullable: true }
                body: { type: string }
      responses:
        '201': { description: Created CounselorRequest }
        '400': { description: body required }

  # /careers (Prompt 2) gained query params in Prompt 3:                # [mock implemented]
  #   sport_friendly=true, near_rgv=true, sector=<key>, rgv_sector=<key>
  # /students/{id}/deadlines now also unions internship application_deadline
  # values as kind="application" entries.                               # [mock implemented]

  # ==================== COLLEGE PATHWAY (Prompt 4) ======================

  /students/{studentId}/college-fits:                                  # [mock implemented]
    get:
      summary: Computed fit between this student and every college
      description: >
        Front-end addition. Scores each college against the student's
        grades (with provenance), compass openness, gender-aware soccer
        program match, Racing partnership and Spanish support. Every match
        carries grades_source so the UI can label confidence
        ("Based on self-reported grades").
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One CollegeFitResult per college
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollegeFitResult' }

  /students/{studentId}/scholarship-outcomes:                          # [mock implemented]
    get:
      summary: Recorded scholarship outcomes (scholarship_outcomes SQL table)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Outcome list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ScholarshipOutcome' }

  /students/{studentId}/scholarship-applications/{applicationId}/recommendations:  # [mock implemented]
    post:
      summary: Request a recommendation letter for an application
      description: Adds to materials_checklist.recommendation_letters {requested, received, names[]}.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommender_name]
              properties:
                recommender_name: { type: string }
      responses:
        '200': { description: Updated ScholarshipApplication }
        '400': { description: recommender_name required }

  /students/{studentId}/scholarship-applications/{applicationId}/recommendations/{name}/received:  # [mock implemented]
    post:
      summary: Mark a requested recommendation letter as received
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
        - { name: applicationId, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated ScholarshipApplication }

  /students/{studentId}/scholarship-applications/{applicationId}/outcome:  # [mock implemented]
    post:
      summary: Record the decision on a submitted application
      description: >
        Creates a scholarship_outcomes row and moves the application to
        awarded/denied. Only decidable from submitted / under_review /
        finalist / waitlisted.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
        - { name: applicationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [awarded]
              properties:
                awarded: { type: boolean }
                award_amount: { type: number, nullable: true }
                decision_date: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Created ScholarshipOutcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScholarshipOutcome' }
        '409': { description: 'NOT_DECIDABLE: application not in a decidable status' }

  /students/{studentId}/essay-drafts:                                  # [mock implemented]
    get:
      summary: Standalone essay drafts (not tied to an application)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: EssayTemplate list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      description: EssayTemplate from the scholarship service spec
    post:
      summary: Start a standalone essay draft
      description: >
        Student-only. start_with_story=true copies the student's My Story
        text into student_draft as a starting point. ai_generated_draft
        stays null — the AI coach is a placeholder ("AI assist – connected
        later") and never writes the essay.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt_text]
              properties:
                prompt_text: { type: string }
                word_limit: { type: integer, nullable: true }
                start_with_story: { type: boolean, default: false }
      responses:
        '201': { description: Created EssayTemplate }
        '403': { description: Student role only }

  /students/{studentId}/essay-drafts/{templateId}:                     # [mock implemented]
    patch:
      summary: Update student_draft or finalize a standalone essay draft
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
        - { name: templateId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                student_draft: { type: string }
                finalized: { type: boolean }
      responses:
        '200': { description: Updated EssayTemplate }

  /students/{studentId}/financial-aid-helper:                          # [mock implemented]
    post:
      summary: FAFSA/TASFA helper checkpoint — DEMO ONLY
      description: >
        Parent-of-child or admin only. The mock accepts the checklist and
        discards it ({ ok, demo_only: true, stored: false }). No income
        data is ever collected or stored in this front end.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Acknowledged, nothing stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  demo_only: { type: boolean }
                  stored: { type: boolean }
        '403': { description: Parent-of-child or admin only }

  # ==================== SPORTS PATHWAY (Prompt 5) =======================

  /students/{studentId}/recruiting-profile:                            # [mock implemented]
    get:
      summary: Assembled recruiting "front page"
      description: >
        Front-end addition. Combines athletic_profiles (positions,
        dominant foot/hand, height/weight, teams), graduation year,
        achievements and coach endorsements. The academic snapshot is
        included only when the student consented (grades_for_matching)
        or the viewer is the student / their parent / staff.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: RecruitingProfile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecruitingProfile' }
    patch:
      summary: Update editable recruiting-profile fields
      description: Student (self) or coach/club staff/admin only.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                positions: { type: array, items: { type: string } }
                dominant_foot: { type: string, enum: [Left, Right, Both], nullable: true }
                dominant_hand: { type: string, nullable: true }
                height_inches: { type: integer, nullable: true }
                weight_pounds: { type: integer, nullable: true }
      responses:
        '200': { description: Updated RecruitingProfile }
        '403': { description: Self or staff only }

  /students/{studentId}/recruiting-preview:                            # [mock implemented]
    get:
      summary: '"See what a scout sees" — consent-stripped preview of self'
      description: >
        Returns visible=false when no sports sharing consent is on, plus the
        current consent flags so the UI can point at the Consent Center.
        When visible, `result` is exactly the ScoutResult a partner would
        get — first name + last initial, no contact info.
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
