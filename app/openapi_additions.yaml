  # ==================== TALENT INSIGHTS (Prompt 6B) =======================
  # FC Brownsville CLUB STAFF ONLY — players, parents, partners, scouts AND
  # admins get a 403. Every response is filtered by:
  #   1. player registered with FC Brownsville OR attended an FCB tryout, AND
  #   2. consent key club_player_development granted (parent, or player 18+).
  # Every request below also writes to the view audit log.
  #
  # Suggested tables:
  #   development_measures(measure_id, student_id, measured_on, source
  #     [racing360|coach_evaluation|physical_test|match_record], technical,
  #     tactical, physical, mentality, minutes_pct, attendance_pct, is_sample)
  #   physical_test_profiles(student_id, speed, agility, endurance, strength,
  #     measured_on, is_sample)
  #   tryout_players(tryout_player_id, student_id NULL, first_name, last_name,
  #     date_of_birth, tryout_date, is_sample)
  #   tryout_evaluations(evaluation_id, tryout_player_id, evaluator_name,
  #     technical, tactical, physical, mentality, notes, created_at)
  #   position_profiles(profile_id, club_id, position, notes, created_by,
  #     updated_at)
  #   position_profile_attributes(profile_id, attribute, weight)
  #   talent_view_log(log_id, viewer_user_id, viewer_name, student_id NULL,
  #     view, viewed_at)
  # Suggested columns: none on existing tables. The consent key
  # club_player_development is a new row value in consent_records.
  # NOTE: "team level" uses the athletic_profiles.competitive_level column;
  # the sample data label "Competitive / Travel" maps to Select.
  /talent/players:                                                     # [mock implemented]
    get:
      summary: Player Development Board — all consented club players
      description: >
        Club staff only. Returns per-player current level, improvement rate
        (points/month over the last 6 months), age-adjusted level, birth
        quarter, team level, minutes and attendance. Players without consent
        are NEVER returned — only their count (consent_off_count).
      responses:
        '200': { description: TalentBoardResponse }
        '403': { description: Club staff only }

  /talent/players/{student_id}/timeline:                               # [mock implemented]
    get:
      summary: One player's standardized measures over time
      description: Club staff only + consent required. Logged as a player-level view.
      parameters:
        - { name: student_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ summary: TalentPlayerSummary, points: DevelopmentPoint[] }' }
        '404': { description: Not in the consented club pool }

  /talent/hidden-gems:                                                 # [mock implemented]
    get:
      summary: High improvement + strong technical/tactical + overlooked
      description: >
        Server-side filter: improvement_rate >= 0.25 AND (technical+tactical)/2
        >= 6 AND (minutes_pct <= 40 OR team level below Academy). Each gem
        carries plain-words reasons (i18n key + params).
      responses:
        '200': { description: '{ gems: HiddenGem[] }' }

  /talent/tryouts:                                                     # [mock implemented]
    get:
      summary: Tryout attendees with evaluations side-by-side
      description: needs_second_look = any dimension where evaluators differ by 2+ points.
      responses:
        '200': { description: '{ players: TryoutPlayer[] }' }

  /talent/tryouts/{tryout_player_id}/evaluations:                      # [mock implemented]
    post:
      summary: Submit a rubric evaluation (technical/tactical/physical/mentality, 1-5)
      responses:
        '201': { description: Updated TryoutPlayer with recomputed flags }

  /talent/position-profiles:                                           # [mock implemented]
    get:
      summary: List coach-defined position profiles
      responses:
        '200': { description: '{ profiles: PositionProfile[] }' }
    post:
      summary: Create a position profile (attributes with weights 1-5)
      responses:
        '201': { description: PositionProfile }

  /talent/position-profiles/{profile_id}:                              # [mock implemented]
    patch:
      summary: Edit a position profile
      responses:
        '200': { description: PositionProfile }

  /talent/position-profiles/{profile_id}/fits:                         # [mock implemented]
    get:
      summary: Weighted 0-100 fit of every consented player against a profile
      description: Includes players currently playing a different position (plays_elsewhere).
      responses:
        '200': { description: '{ fits: PositionFit[] }' }

  /talent/fairness:                                                    # [mock implemented]
    get:
      summary: Selection fairness — top-team selection by birth quarter, gender, ZIP
      responses:
        '200': { description: FairnessReport }

  /talent/audit:                                                       # [mock implemented]
    get:
      summary: View audit log (who viewed which player, when) — latest 50
      responses:
        '200': { description: '{ entries: TalentViewLogEntry[] }' }

components:
  schemas:
    ConsentRecord:
      type: object
      properties:
        student_id: { type: string }
        consents:
          type: object
          additionalProperties:
            type: object
            properties:
              key: { type: string }
              granted: { type: boolean }
              granted_at: { type: string, format: date-time, nullable: true }
              granted_by_role: { type: string, nullable: true }
        access_log:
          type: array
          items:
            type: object
            properties:
              party: { type: string }
              scope: { type: string }
              since: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time }
    CollegeFitResult:
      type: object
      description: Computed school fit — front-end addition (Prompt 4)
      properties:
        college_id: { type: string }
        fit: { type: string, enum: [strong, good, explore] }
        gpa_ok: { type: boolean, nullable: true, description: 'null = no grades on file' }
        why_en: { type: array, items: { type: string } }
        why_es: { type: array, items: { type: string } }
        missing_en: { type: array, items: { type: string } }
        missing_es: { type: array, items: { type: string } }
        grades_source:
          type: string
          enum: [self_reported, report_card, school_import, none]
          description: Grade provenance for confidence labels
    ScholarshipOutcome:
      type: object
      description: Mirrors scholarship_outcomes SQL table
      properties:
        outcome_id: { type: string }
        application_id: { type: string }
        student_id: { type: string }
        scholarship_id: { type: string }
        awarded: { type: boolean }
        award_year: { type: integer }
        award_amount: { type: number, nullable: true }
        decision_date: { type: string, format: date }
        notes: { type: string, nullable: true }
        scholarship:
          type: object
          description: Embedded Scholarship from the scholarship service spec
    Racing360Report:
      type: object
      properties:
        report_id: { type: string }
        student_id: { type: string }
        report_date: { type: string, format: date }
        source: { type: string, description: 'Racing 360 (SAMPLE – field names to confirm)' }
        file_url: { type: string, nullable: true }
        coach_notes: { type: string, nullable: true }
        metrics:
          type: object
          description: Field names to confirm with vendor
        created_at: { type: string, format: date-time }

    # ---- Prompt 5 (sports pathway) ----
    # Suggested SQL tables (front-end additions):
    #   sport_opportunities (opportunity_id, lane, sport, title_en/es,
    #     org_name, level_en/es, age_min/max, location_en/es, country,
    #     dates_en/es, cost_usd, cost_note_en/es, requirements jsonb)
    #   coach_endorsements (endorsement_id, student_id, coach_name,
    #     coach_org, text, created_at)
    #   recruiting_achievements (achievement_id, student_id, text, year)
    #   contact_requests (request_id, student_id, requester_org,
    #     requester_role, message, status, created_at)
    # player_performance_timeline already exists in video_media_schema.sql;
    # PerformancePoint.source is the only extra column to add there.
    PerformancePoint:
      type: object
      description: Mirrors player_performance_timeline + source column
      properties:
        timeline_id: { type: string }
        student_id: { type: string }
        assessment_date: { type: string, format: date }
        season: { type: string, nullable: true }
        overall_rating: { type: number, nullable: true }
        technical_skills: { type: number, nullable: true }
        tactical_awareness: { type: number, nullable: true }
        physical_fitness: { type: number, nullable: true }
        mental_toughness: { type: number, nullable: true }
        trajectory: { type: string, nullable: true }
        assessment_notes: { type: string, nullable: true }
        coach_observations: { type: string, nullable: true }
        source: { type: string, enum: [video_analysis, racing360, coach_entry], description: FRONT-END ADDITION }
        created_at: { type: string, format: date-time }
    RecruitingProfile:
      type: object
      description: Assembled view — no single table
      properties:
        student_id: { type: string }
        sport: { type: string }
        positions: { type: array, items: { type: string } }
        dominant_foot: { type: string, nullable: true }
        dominant_hand: { type: string, nullable: true }
        height_inches: { type: integer, nullable: true }
        weight_pounds: { type: integer, nullable: true }
        teams: { type: array, items: { type: object } }
        grad_year: { type: integer, nullable: true }
        skill_level: { type: string, nullable: true }
        academic_snapshot: { type: object, nullable: true, description: Only with consent }
        achievements: { type: array, items: { type: object } }
        endorsements: { type: array, items: { type: object } }
        video_count: { type: integer }
        highlight_count: { type: integer }
        is_sample: { type: boolean }
    SportOpportunity:
      type: object
      properties:
        opportunity_id: { type: string }
        lane: { type: string, enum: [college, national, international] }
        sport: { type: string }
        title_en: { type: string }
        title_es: { type: string }
        org_name: { type: string }
        level_en: { type: string }
        level_es: { type: string }
        age_min: { type: integer }
        age_max: { type: integer }
        location_en: { type: string }
        location_es: { type: string }
        country: { type: string }
        dates_en: { type: string }
        dates_es: { type: string }
        cost_usd: { type: number, nullable: true }
        requirements_en: { type: array, items: { type: string } }
        requirements_es: { type: array, items: { type: string } }
        is_sample: { type: boolean }
    ScoutResult:
      type: object
      description: What a scout sees — no contact info, first name + last initial
      properties:
        student_id: { type: string }
        display_name: { type: string }
        age: { type: integer, nullable: true }
        grad_year: { type: integer, nullable: true }
        gender: { type: string, nullable: true }
        sport: { type: string }
        positions: { type: array, items: { type: string } }
        competitive_level: { type: string, nullable: true }
        team_name: { type: string, nullable: true }
        height_inches: { type: integer, nullable: true }
        overall_rating: { type: number, nullable: true }
        open_to: { type: array, items: { type: string } }
        under_18: { type: boolean }
        is_sample: { type: boolean }
    ContactRequest:
      type: object
      properties:
        request_id: { type: string }
        student_id: { type: string }
        requester_org: { type: string }
        requester_role: { type: string, enum: [college, pro_club, employer, training_school] }
        message: { type: string }
        status: { type: string, enum: [pending_parent, pending_student, approved, declined] }
        created_at: { type: string, format: date-time }

    # ---- Prompt 6 (staff / partner / admin) ----
    CaseloadItem:
      type: object
      description: Aggregated coach/counselor caseload row (computed view)
      properties:
        student_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        grade_level: { type: integer, nullable: true }
        school_name: { type: string, nullable: true }
        app_mode: { type: string }
        pathway_status: { type: object }
        next_deadline: { type: object, nullable: true }
        missing_items: { type: array, items: { type: string }, description: i18n keys }
        needs_attention: { type: array, items: { type: string }, description: i18n keys }
    StaffNote:
      type: object
      properties:
        note_id: { type: string }
        student_id: { type: string }
        author_name: { type: string }
        author_role: { type: string, enum: [coach, club_staff, admin] }
        body: { type: string }
        created_at: { type: string, format: date-time }
    StudentPlacement:
      type: object
      description: student_placements subset (no supervisor contacts)
      properties:
        placement_id: { type: string }
        student_id: { type: string }
        partner_id: { type: string }
        posting_id: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        actual_end_date: { type: string, format: date, nullable: true }
        job_title: { type: string }
        completion_status: { type: string, enum: [active, completed, ended_early] }
        offered_full_time: { type: boolean, nullable: true }
        accepted_full_time: { type: boolean, nullable: true }
        pay_rate: { type: number, nullable: true }
    CollegeEnrollment:
      type: object
      properties:
        enrollment_id: { type: string }
        student_id: { type: string }
        college_id: { type: string }
        enrollment_year: { type: integer }
        status: { type: string, enum: [enrolled, attending] }
    SignatureDoc:
      type: object
      properties:
        doc_id: { type: string }
        student_id: { type: string }
        title_en: { type: string }
        title_es: { type: string }
        status: { type: string, enum: [pending, signed] }
        signed_by: { type: string, nullable: true }
        signed_at: { type: string, format: date-time, nullable: true }
    ApprovalItem:
      type: object
      description: Union read model — consents, contact requests, signatures
      properties:
        item_id: { type: string }
        kind: { type: string, enum: [contact_request, consent, signature] }
        ref_id: { type: string }
        title_en: { type: string }
        title_es: { type: string }
        detail_en: { type: string }
        detail_es: { type: string }
        status: { type: string, enum: [pending, approved, declined, signed, granted] }
        created_at: { type: string, format: date-time }
    OutcomesReport:
      type: object
      description: Aggregates only — no student identifiers
      properties:
        filters: { type: object }
        students_served: { type: integer }
        by_pathway:
          type: object
          properties:
            career: { type: integer }
            college: { type: integer }
            sports: { type: integer }
        certificates_earned: { type: integer }
        avg_weeks_to_first_job: { type: number, nullable: true }
        scholarships:
          type: object
          properties:
            applied: { type: integer }
            awarded: { type: integer }
            dollars: { type: number }
        college_enrollments: { type: integer }
        athletes_recruited: { type: integer }
        placements_by_partner:
          type: array
          items:
            type: object
            properties:
              partner_id: { type: string }
              partner_name: { type: string }
              placements: { type: integer }
              completed: { type: integer }
              converted_to_full_time: { type: integer }
        generated_at: { type: string, format: date-time }
    PartnerApplicant:
      type: object
      properties:
        application_id: { type: string }
        posting_id: { type: string }
        posting_title: { type: string }
        student_display: { type: string, description: First name + last initial }
        status: { type: string }
        applied_at: { type: string, format: date-time }

    # -------------------- TALENT INSIGHTS (Prompt 6B) --------------------
    DevelopmentPoint:
      type: object
      properties:
        date: { type: string, format: date }
        source: { type: string, enum: [racing360, coach_evaluation, physical_test, match_record] }
        technical: { type: number, nullable: true, description: 1-10 standardized }
        tactical: { type: number, nullable: true }
        physical: { type: number, nullable: true }
        mentality: { type: number, nullable: true }
        minutes_pct: { type: integer, nullable: true }
        attendance_pct: { type: integer, nullable: true }
    TalentPlayerSummary:
      type: object
      properties:
        student_id: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        birth_year: { type: integer }
        birth_quarter: { type: integer, enum: [1, 2, 3, 4], description: 1=Jan-Mar .. 4=Oct-Dec }
        gender: { type: string, nullable: true }
        zip_code: { type: string, nullable: true }
        primary_position: { type: string, nullable: true }
        team: { type: string, nullable: true }
        team_level: { type: string, nullable: true, description: athletic_profiles.competitive_level }
        current_level: { type: number, description: 1-10, average of latest standardized scores }
        improvement_rate: { type: number, description: points per month, last 6 months }
        age_adjusted_level: { type: number, description: current + 0.25 per later birth quarter (heuristic) }
        minutes_pct: { type: integer, nullable: true }
        attendance_pct: { type: integer, nullable: true }
        latest_scores:
          type: object
          properties:
            technical: { type: number }
            tactical: { type: number }
            physical: { type: number }
            mentality: { type: number }
        last_measure_date: { type: string, format: date }
    TalentBoardResponse:
      type: object
      properties:
        players:
          type: array
          items: { $ref: '#/components/schemas/TalentPlayerSummary' }
        consent_off_count: { type: integer, description: club players without consent — never listed }
    HiddenGem:
      allOf:
        - $ref: '#/components/schemas/TalentPlayerSummary'
        - type: object
          properties:
            reasons:
              type: array
              items:
                type: object
                properties:
                  key: { type: string, enum: [improved_dim, low_minutes, low_team_level, strong_ratings] }
                  params: { type: object, additionalProperties: true }
    TryoutEvaluation:
      type: object
      properties:
        evaluation_id: { type: string }
        tryout_player_id: { type: string }
        evaluator_name: { type: string }
        technical: { type: integer, minimum: 1, maximum: 5 }
        tactical: { type: integer, minimum: 1, maximum: 5 }
        physical: { type: integer, minimum: 1, maximum: 5 }
        mentality: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    TryoutPlayer:
      type: object
      properties:
        tryout_player_id: { type: string }
        student_id: { type: string, nullable: true }
        first_name: { type: string }
        last_name: { type: string }
        birth_year: { type: integer }
        birth_quarter: { type: integer, enum: [1, 2, 3, 4] }
        tryout_date: { type: string, format: date }
        evaluations:
          type: array
          items: { $ref: '#/components/schemas/TryoutEvaluation' }
        needs_second_look: { type: boolean }
        disagreement_dims:
          type: array
          items: { type: string, enum: [technical, tactical, physical, mentality] }
    PositionProfile:
      type: object
      properties:
        profile_id: { type: string }
        position: { type: string }
        attributes:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string, enum: [technical, tactical, physical, mentality, speed, agility, endurance, strength] }
              weight: { type: integer, minimum: 1, maximum: 5 }
        notes: { type: string, nullable: true }
        created_by: { type: string }
        updated_at: { type: string, format: date-time }
    PositionFit:
      type: object
      properties:
        player: { $ref: '#/components/schemas/TalentPlayerSummary' }
        fit_score: { type: integer, description: 0-100 weighted match }
        plays_elsewhere: { type: boolean }
        top_matches:
          type: array
          items: { type: string }
    FairnessGroup:
      type: object
      properties:
        label: { type: string }
        selected: { type: integer }
        pool: { type: integer }
        rate: { type: number, nullable: true }
    FairnessReport:
      type: object
      properties:
        by_birth_quarter:
          type: array
          items: { $ref: '#/components/schemas/FairnessGroup' }
        by_gender:
          type: array
          items: { $ref: '#/components/schemas/FairnessGroup' }
        by_zip:
          type: array
          items: { $ref: '#/components/schemas/FairnessGroup' }
        selected_definition: { type: string }
    TalentViewLogEntry:
      type: object
      properties:
        log_id: { type: string }
        viewer_name: { type: string }
        viewer_role: { type: string }
        student_id: { type: string, nullable: true }
        player_name: { type: string, nullable: true }
        view: { type: string }
        viewed_at: { type: string, format: date-time }
